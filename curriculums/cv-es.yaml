          - >-
            He creado y mantenido sitios web de WordPress utilizando editores visuales como Divi y Elementor, y he
            configurado WooCommerce para el comercio electrónico.
          - >-
            Mejoré el rendimiento de la página web utilizando PageSpeed Insights y analicé las métricas del sitio con
