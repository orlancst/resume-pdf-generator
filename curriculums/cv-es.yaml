          - >-
            Servicios gestionados de alojamiento web multilínea y uso de WordPress con soluciones «low-code» para la
            configuración personalizada de plugins.
          - Se han conectado sitios web a pasarelas de pago como PayU y PayPal para facilitar las transacciones.
          - >-
            Desarrollé formularios e informes basados en bases de datos utilizando PHP nativo y gestioné bases de datos
